; /etc/php/8.4/fpm/pool.d/srympex.conf
; The app runs as its own "srympex" user; nginx talks to it through this socket.
[srympex]
user = srympex
group = srympex
listen = /run/php/srympex.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 16 GB RAM, ~12 people: plenty of headroom.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 110M
php_admin_value[max_file_uploads] = 20
php_admin_value[max_execution_time] = 120
php_admin_flag[expose_php] = off
