# /etc/nginx/sites-available/srympex
# Replace hrms.example.com with your address (two places below and the certificate paths).

server {
    listen 80;
    server_name hrms.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hrms.example.com;

    ssl_certificate     /etc/letsencrypt/live/hrms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrms.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/srympex/public;
    index index.php;
    charset utf-8;

    # Document uploads: up to 10 files of 10 MB at once.
    client_max_body_size 110M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built CSS/JS have hashed names, so browsers may keep them for a year.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/srympex.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    # Never serve dotfiles (.env, .git ...).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;
}
