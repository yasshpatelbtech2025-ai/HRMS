; /etc/supervisor/conf.d/srympex-worker.conf
; Keeps the background worker (employee imports, emails) running, and restarts it if it stops or after a reboot.
[program:srympex-worker]
command=/usr/bin/php /var/www/srympex/artisan queue:work --sleep=3 --tries=1 --timeout=900 --max-time=3600
directory=/var/www/srympex
user=srympex
autostart=true
autorestart=true
stopwaitsecs=910
redirect_stderr=true
stdout_logfile=/var/www/srympex/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
