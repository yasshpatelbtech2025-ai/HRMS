# /etc/postgresql/17/main/conf.d/srympex.conf
# Tuned for this server (16 GB RAM, one 7,200 rpm disk) with the app on the same machine.
listen_addresses = 'localhost'
shared_buffers = 2GB
effective_cache_size = 8GB
work_mem = 16MB
maintenance_work_mem = 512MB
# A spinning disk: random reads are costly; keep the planner's default view of that.
random_page_cost = 4
effective_io_concurrency = 2
wal_compression = on
checkpoint_completion_target = 0.9
max_connections = 50
